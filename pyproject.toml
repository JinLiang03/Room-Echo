[project]
name = "wifi-spatial-council"
version = "0.1.0"
description = "ESP32 Wi-Fi CSI sensing demo: three calibrated proxy signals, an auditable multi-agent council, and a fluid web experience."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "pydantic>=2.10.0,<3",
    "numpy>=2.1.0,<3",
    "scipy>=1.14.0,<2",
    "polars>=1.20.0,<2",
    "pyarrow>=18.0.0,<21",
    "openai-agents>=0.1.0",
    # DeepSeek exposes an OpenAI-compatible Chat Completions API. Declaring
    # the SDK explicitly keeps that direct production import auditable rather
    # than relying on openai-agents' transitive dependency.
    "openai>=2.53.0,<3",
    "jsonschema>=4.23.0,<5",
    # mcp: standards-compliant initialize/tool negotiation and Streamable HTTP
    # lifecycle are not provided by the Python standard library. Keep the
    # official SDK explicit even though openai-agents also pulls it transitively.
    "mcp>=1.29.0,<2",
    # zstandard: replay bundles are stored as raw.csi.zst per DATA_CONTRACTS;
    # stdlib has no zstd codec. pyserial: USB serial access for live RX links;
    # stdlib has no serial-port support. Both are mandated by the project spec.
    "zstandard>=0.23.0,<1",
    "pyserial>=3.5,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "wifi_contracts",
    "wifi_api",
    "wifi_collector",
    "wifi_sensing",
    "wifi_council",
    "wsc_wire",
]

[tool.setuptools.package-dir]
wifi_contracts = "packages/contracts/wifi_contracts"
wifi_api = "services/api/wifi_api"
wifi_collector = "services/collector/wifi_collector"
wifi_sensing = "services/sensing/wifi_sensing"
wifi_council = "services/council/wifi_council"
wsc_wire = "firmware/shared/python/wsc_wire"

[project.scripts]
wsc-collector = "wifi_collector.cli:main"
wsc-calibration = "wifi_sensing.calibration_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "hypothesis>=6.124.0,<7",
    "ruff>=0.9.0,<1",
    "mypy>=1.14.0,<2",
    "httpx>=0.28.0,<1",
    "types-pyserial>=3.5,<4",
    # esptool: standalone flash of prebuilt firmware bins without requiring a
    # full ESP-IDF toolchain on the colleague's handoff machine (scripts/flash_bundle.sh).
    "esptool>=4.8.0,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "services", "scripts", "tests", "firmware/shared/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = [
    "packages/contracts",
    "services/api",
    "services/collector",
    "services/sensing",
    "services/council",
    "firmware/shared/python",
]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not hardware", "-ra"]
markers = [
    "hardware: requires physical ESP32 hardware (excluded by default)",
    "openai_smoke: opt-in OpenAI provider integration test",
    "deepseek_smoke: opt-in DeepSeek provider integration test",
]
pythonpath = [
    "packages/contracts",
    "services/api",
    "services/collector",
    "services/sensing",
    "services/council",
    "firmware/shared/python",
]

[tool.coverage.run]
branch = true
source = ["wifi_contracts", "wifi_api"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
